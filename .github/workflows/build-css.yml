name: Build CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-css-main
  cancel-in-progress: true

jobs:
  build-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Commit compiled CSS when changed
        run: |
          if git diff --quiet -- assets/css/main.css; then
            echo "main.css is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/main.css
          git commit -m "build(css): regenerate from main.scss"
          git push
