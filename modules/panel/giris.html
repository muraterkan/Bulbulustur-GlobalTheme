<!doctype html>
<html lang="tr" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulbulustur Panel — Giriş Yap (Faz 11)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
<div class="bb-app bb-panel bb-panel-auth" data-bb-panel-layout="auth">
 <div class="bb-shell"><main class="bb-main"><div class="bb-main-inner"><section class="bb-content" aria-label="Giriş Yap">
 <div class="bb-panel-content-container">
 <a class="bb-panel-auth-brand" href="dashboard.html"><span class="material-symbols-outlined" aria-hidden="true">layers</span><span>Bulbulustur Panel</span></a>
 <div class="bb-card">
  <div class="bb-card-body">
   <h1 class="bb-panel-auth-title h3 mb-2">Giriş Yap</h1>
   <p class="bb-panel-auth-subtitle mb-4">Hesabına erişmek için bilgilerini gir.</p>
   <form data-bb-auth-form="login">
   <div class="mb-3"><label class="form-label required" for="bb_auth_email">E-posta adresi</label><input class="form-control form-control-solid" id="bb_auth_email" name="email" type="email" autocomplete="username" placeholder="ornek@eposta.com" required></div>
<div class="mb-3"><label class="form-label required" for="bb_auth_password">Şifre</label><div class="input-group"><input class="form-control form-control-solid" id="bb_auth_password" data-bb-auth-password name="password" type="password" autocomplete="current-password" minlength="8" required><button class="btn btn-outline-secondary" type="button" data-bb-auth-password-toggle aria-pressed="false" aria-controls="bb_auth_password">Göster</button></div></div>
<div class="bb-panel-auth-links mb-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="bb_auth_remember" name="remember"><label class="form-check-label" for="bb_auth_remember">Beni hatırla</label></div><a href="sifre-sifirla.html">Şifremi unuttum</a></div>
   <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
   </form>
   <div class="bb-alert bb-alert-success bb-panel-auth-result mt-4" data-bb-auth-result role="status" tabindex="-1" hidden></div>
   <p class="bb-panel-auth-subtitle text-center mt-4 mb-0">Hesabın yok mu? <a href="kayit.html">Kayıt ol</a></p>
  </div>
 </div>
 <p class="bb-panel-auth-subtitle text-center mt-3">Arayüz demosu — hesap, oturum veya veri kaydı yapılmaz.</p>
 </div></section></div></main></div>
</div>
<script src="../../assets/js/bb-panel-auth.js"></script>
</body></html>
