<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Bulbulustur Theme — Passwordmi Sıfırla</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <div class="bb-app bb-panel bb-panel-auth bb-panel-auth-login" data-bb-panel-layout="auth">
        <main class="bb-panel-login-layout">
            <aside class="bb-panel-login-brand" aria-label="Bulbulustur marka alanı">
                <div class="bb-panel-login-brand-art" aria-hidden="true"></div>
                <div class="bb-panel-login-brand-copy">
                    <div class="bb-panel-login-logo">
                        <span class="material-symbols-outlined" aria-hidden="true">layers</span>
                        <strong>Bulbulustur</strong>
                    </div>
                    <p>Digital solutions that grow your business</p>
                </div>
            </aside>
            <section class="bb-panel-login-surface" aria-label="Passwordmi Sıfırla">
                <div class="bb-panel-login-main">
                    <div class="bb-panel-login-form-wrapper">
                        <header class="bb-panel-login-intro"><h1>Reset Your Password</h1><p>Enter your email address; the demo form only performs validation.</p></header>
                        <form data-bb-auth-form="reset">
                            <div class="bb-panel-login-field">
                                <label class="visually-hidden" for="bb_auth_email">E-mail</label>
                                <input class="form-control form-control-solid" id="bb_auth_email" name="email" type="email" autocomplete="email" placeholder="E-mail" required>
                            </div>
                            <button type="submit" class="btn btn-primary bb-panel-login-submit">Request Reset Link</button>
                        </form>
                        <div class="bb-alert bb-alert-success bb-panel-auth-result mt-3" data-bb-auth-result role="status" tabindex="-1" hidden></div>
                        <p class="bb-panel-login-signup"><a href="sign-in.html">Back to Login</a></p><p class="bb-panel-login-demo">Interface demo: No email is sent.</p>
                    </div>
                </div>
                <!--::Footer-->
                <footer class="bb-panel-login-footer">
                    <span>
                        Türkçe <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
                    </span>
                    <nav aria-label="Sub Links"><a href="sign-in.html">Giriş</a><a href="sign-up.html">Register</a><a href="reset-password.html">Help</a></nav>
                </footer>
                <!--/::Footer-->
            </section>
        </main>
    </div>
    <script src="../../assets/js/panel/bb-panel-auth.js"></script>
</body>
<!--/::Body-->
</html>
