<!doctype html>
<html lang="tr" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulbulustur Panel — Kayıt Ol (Faz 11)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
<div class="bb-app bb-panel bb-panel-auth" data-bb-panel-layout="auth">
 <div class="bb-shell"><main class="bb-main"><div class="bb-main-inner"><section class="bb-content" aria-label="Kayıt Ol">
 <div class="bb-panel-content-container">
 <a class="bb-panel-auth-brand" href="dashboard.html"><span class="material-symbols-outlined" aria-hidden="true">layers</span><span>Bulbulustur Panel</span></a>
 <div class="bb-card">
  <div class="bb-card-body">
   <h1 class="bb-panel-auth-title h3 mb-2">Kayıt Ol</h1>
   <p class="bb-panel-auth-subtitle mb-4">Panel için örnek hesap oluşturma arayüzü.</p>
   <form data-bb-auth-form="register">
   <div class="mb-3"><label class="form-label required" for="bb_auth_name">Ad soyad</label><input class="form-control form-control-solid" id="bb_auth_name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
<div class="mb-3"><label class="form-label required" for="bb_auth_email">E-posta adresi</label><input class="form-control form-control-solid" id="bb_auth_email" name="email" type="email" autocomplete="email" placeholder="ornek@eposta.com" required></div>
<div class="mb-3"><label class="form-label required" for="bb_auth_password">Şifre</label><div class="input-group"><input class="form-control form-control-solid" id="bb_auth_password" data-bb-auth-password name="password" type="password" minlength="8" autocomplete="new-password" required><button class="btn btn-outline-secondary" type="button" data-bb-auth-password-toggle aria-pressed="false" aria-controls="bb_auth_password">Göster</button></div><div class="form-text">En az 8 karakter.</div></div>
<div class="mb-3"><label class="form-label required" for="bb_auth_confirm">Şifre tekrar</label><input class="form-control form-control-solid" id="bb_auth_confirm" data-bb-auth-confirm name="confirm" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="form-check mb-4"><input class="form-check-input" id="bb_auth_terms" name="terms" type="checkbox" required><label class="form-check-label" for="bb_auth_terms">Demo form koşullarını okudum.</label></div>
   <button type="submit" class="btn btn-primary w-100">Hesap Oluştur</button>
   </form>
   <div class="bb-alert bb-alert-success bb-panel-auth-result mt-4" data-bb-auth-result role="status" tabindex="-1" hidden></div>
   <p class="bb-panel-auth-subtitle text-center mt-4 mb-0">Zaten hesabın var mı? <a href="giris.html">Giriş yap</a></p>
  </div>
 </div>
 <p class="bb-panel-auth-subtitle text-center mt-3">Arayüz demosu — hesap, oturum veya veri kaydı yapılmaz.</p>
 </div></section></div></main></div>
</div>
<script src="../../assets/js/bb-panel-auth.js"></script>
</body></html>
