<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulbulustur Panel — Register</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body class="bb-body">
  <div class="bb-wrapper">
    <header>
</header>
<main class="bb-main">
      
        <div class="bb-container">
<div class="bb-app bb-panel bb-panel-auth bb-panel-auth-login" data-bb-panel-layout="auth">
  <header>
</header>
<main class="bb-panel-login-layout">
    <aside class="bb-panel-login-brand" aria-label="Bulbulustur marka alanı">
      <div class="bb-panel-login-brand-art" aria-hidden="true"></div>
      <div class="bb-panel-login-brand-copy">
        <div class="bb-panel-login-logo">
<span class="material-symbols-outlined" aria-hidden="true">layers</span><strong>Bulbulustur</strong></div>
        <p>İşinizi büyüten dijital çözümler</p>
      </div>
    </aside>
    <section class="bb-panel-login-surface" aria-label="Register">
      <div class="bb-panel-login-main">
<div class="bb-panel-login-form-wrapper"><header class="bb-panel-login-intro"><h1>Register</h1><p>Bulbulustur yönetim paneli için demo hesabınızı oluşturun.</p></header>
<form data-bb-auth-form="register">
  <div class="bb-panel-login-field"><label class="visually-hidden" for="bb_auth_name">Ad soyad</label><input class="form-control form-control-solid" id="bb_auth_name" name="name" type="text" autocomplete="name" maxlength="120" placeholder="Ad soyad" required></div>
  <div class="bb-panel-login-field"><label class="visually-hidden" for="bb_auth_email">E-posta adresi</label><input class="form-control form-control-solid" id="bb_auth_email" name="email" type="email" autocomplete="email" placeholder="E-posta adresi" required></div>
  <div class="bb-panel-login-field"><label class="visually-hidden" for="bb_auth_password">Şifre</label>
<div class="bb-panel-login-password"><input class="form-control form-control-solid" id="bb_auth_password" data-bb-auth-password name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Şifre" required>\<button class="bb-panel-login-password-toggle" type="button" data-bb-auth-password-toggle aria-pressed="false" aria-controls="bb_auth_password">Göster</button></div>
</div>
  <div class="bb-panel-login-field"><label class="visually-hidden" for="bb_auth_confirm">Şifre tekrar</label><input class="form-control form-control-solid" id="bb_auth_confirm" data-bb-auth-confirm name="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Şifre tekrar" required></div>
  <div class="form-check mb-4"><input class="form-check-input" id="bb_auth_terms" name="terms" type="checkbox" required><label class="form-check-label" for="bb_auth_terms">Demo form koşullarını okudum.</label></div>
  <button type="submit" class="btn btn-primary bb-panel-login-submit">Manage Account Create</button>
</form>
<div class="bb-alert bb-alert-success bb-panel-auth-result mt-3" data-bb-auth-result role="status" tabindex="-1" hidden></div>
<p class="bb-panel-login-signup">Zaten hesabınız var mı? <a href="sign-in.html">Giriş yapın</a></p><p class="bb-panel-login-demo">Arayüz demosu: Manage Account oluşturulmaz ve veri gönderilmez.</p></div>
</div>
      <footer class="bb-panel-login-footer"><span>Türkçe <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
</span><nav aria-label="Alt bağlantılar"><a href="sign-in.html">Giriş</a><a href="sign-up.html">Kayıt</a><a href="reset-password.html">Yardım</a></nav></footer>
    </section>
  </main>
<footer>
</footer>
</div>
<script src="../../assets/js/panel/bb-panel-auth.js"></script>

        </main>
<footer>
</footer>
  </div>
</body>
</html>
