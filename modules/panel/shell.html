<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <div class="bb-app bb-panel" data-bb-panel data-bb-sidebar-open="false" data-bb-sidebar-collapsed="false">
        <aside class="bb-sidebar" id="bb_panel_sidebar" aria-label="Panel kenar menüsü">
            <div class="bb-sidebar-header">
                <a class="bb-sidebar-logo" href="shell.html" aria-label="Bulbulustur panel ana sayfa">
                    <span class="bb-panel-brand-text">Bulbulustur</span>
                </a>
                <button class="bb-panel-icon-button d-none d-lg-inline-flex" type="button" data-bb-panel-sidebar-collapse aria-label="Kenar çubuğunu daralt" aria-pressed="false" title="Daralt / genişlet">
                    <span class="material-symbols-outlined" aria-hidden="true">left_panel_close</span>
                </button>
                <button class="bb-panel-icon-button d-lg-none" type="button" data-bb-panel-sidebar-close aria-label="Close Menu">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>

            </div>
            <div class="bb-sidebar-body">
                <nav aria-label="Örnek panel gezinme" class="px-2">
                    <a class="bb-panel-sidebar-link" href="shell.html" aria-current="page" title="Kabuk">
                        <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
                        <span class="bb-panel-sidebar-label">Kabuk</span>
                    </a>
                </nav>
            </div>
        </aside>

        <button class="bb-panel-backdrop" type="button" data-bb-panel-backdrop aria-label="Close Menu" aria-hidden="true" tabindex="-1"></button>

        <div class="bb-shell">
            <header class="bb-shell-header">
                <div class="bb-shell-header-inner">
                    <div class="bb-shell-header-left">
                        <button class="bb-panel-icon-button d-lg-none" type="button" data-bb-panel-sidebar-toggle aria-controls="bb_panel_sidebar" aria-expanded="false" aria-label="Menüyü aç">

                        </button>
                        <span class="bb-panel-brand-text">Bulbulustur / Yönetim Paneli</span>
                    </div>
                    <div class="bb-shell-header-right">
                        <button class="bb-panel-icon-button" type="button" id="bb_panel_theme_toggle" aria-label="Açık veya koyu temayı değiştir">
                            <span class="material-symbols-outlined" aria-hidden="true">contrast</span>
                        </button>
                        <span class="bb-symbol bb-symbol-35" aria-label="Örnek kullanıcı">
                            <img src="../../assets/media/avatars/2ab21709-aa5c-451e-8be7-3b8c56c59a3c.webp" alt="Örnek kullanıcı avatarı">
                        </span>
                    </div>
                </div>
            </header>



            <!--::Main-->
            <main class="bb-main">
                <!--::Wrapper-->
                <div class="bb-wrapper">
                    <div class="bb-container">
                        <div class="bb-toolbar">
                            <div class="bb-panel-content-container">
                                <div class="bb-toolbar-row">
                                    <div class="bb-toolbar-col-left">
                                        <h1 class="bb-page-title">Panel kabuğu</h1>
                                        <nav class="bb-breadcrumb" aria-label="İçerik yolu">
                                            <ol class="breadcrumb mb-0">
                                                <li class="breadcrumb-item"><a href="shell.html">Panel</a></li>
                                                <li class="breadcrumb-item active" aria-current="page">Kabuk</li>
                                            </ol>
                                        </nav>
                                    </div>
                                    <div class="bb-toolbar-col-right">
                                        <span class="bb-badge bb-badge-primary">Faz 1</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <section class="bb-content" aria-label="Sayfa içeriği">
                            <div class="bb-panel-content-container">
                                <div class="card bb-card">
                                    <div class="bb-card-header">
                                        <h2 class="bb-card-title">Boş sayfa şablonu</h2>
                                    </div>
                                    <div class="bb-card-body">
                                        <p class="mb-0">Panelin ana omurgası: sidebar, header, toolbar, içerik ve footer. Menü ağacı Faz 2'de eklenecek.</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>

            <!--::Footer-->
            <footer class="bb-shell-footer bb-footer">
                <div class="bb-footer-bar">
                    <div class="bb-footer-inner">

                            <a class="bb-footer-brand" href="dashboard.html">Bulbulustur</a>
                        </div>
                        <nav class="bb-footer-right" aria-label="Sub Links">
                            <a class="bb-footer-link" href="../components/cards.html">Components</a>
                            <a class="bb-footer-link" href="../components/menu.html">Menus</a>
                        </nav>
                    </div>
                </div>
            </footer>
            <!--/::Footer-->
        </div>

    <script src="../../assets/js/panel/bb-panel.js"></script>
    <script src="../../assets/js/panel/bb-panel-theme.js"></script>
