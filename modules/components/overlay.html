<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BB Overlay Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="p-4">

<div class="container">
    <div class="row g-4">

        <!-- ================= IMAGE OVERLAY ================= -->
        <div class="col-md-4">
            <div class="card bb-overlay bb-overlay-hover bb-overlay-rounded">
                <div class="bb-overlay-wrapper">
                    <img src="https://picsum.photos/600/400" class="w-100">
                </div>

                <div class="bb-overlay-layer bg-dark bg-opacity-25">
                    <a class="btn btn-primary btn-sm">Explore</a>
                    <a class="btn btn-light btn-sm ms-2">Buy</a>
                </div>
            </div>
        </div>

        <!-- ================= CARD BODY BLOCK ================= -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body bb-overlay bb-overlay-block bb-overlay-rounded">
                    <div class="bb-overlay-wrapper">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                    </div>

                    <div class="bb-overlay-layer bg-dark bg-opacity-10">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= FORM BLOCK ================= -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body bb-overlay bb-overlay-block bb-overlay-rounded">
                    <div class="bb-overlay-wrapper">
                        <input class="form-control mb-2" placeholder="Name">
                        <input class="form-control" placeholder="Email">
                    </div>

                    <div class="bb-overlay-layer bg-dark bg-opacity-10">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
