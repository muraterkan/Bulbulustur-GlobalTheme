<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title>Bulbulustur Theme — Datetime (PURE)</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
   <!--::Scripts--> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <!--::Main-->
    <main class="bb-main">
        <!--::Wrapper-->
<div class="bb-wrapper">
            <div class="bb-container">
                <section class="bb-section">

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="card bb-card">
                                <div class="bb-card-header">
<h2 class="bb-card-title">Range</h2></div>
                                <div class="bb-card-body">
                                    <div class="bb-datetime" data-bb-datetime="range">
                                        <div class="bb-datetime-field">
                                            <input type="text" class="form-control bb-datetime-input" placeholder="Tarih aralığı seçin" readonly>
                                            <span class="bb-datetime-icon material-symbols-outlined" aria-hidden="true">date_range</span>
                                        </div>
                                    </div>
                                    <p class="text-muted mt-3 mb-0">Start + End seçimi. Preset’ler solda.</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="card bb-card">
                                <div class="bb-card-header">
<h2 class="bb-card-title">Single Date</h2></div>
                                <div class="bb-card-body">
                                    <div class="bb-datetime" data-bb-datetime="single">
                                        <div class="bb-datetime-field">
                                            <input type="text" class="form-control bb-datetime-input" placeholder="Tarih seçin" readonly>
                                            <span class="bb-datetime-icon material-symbols-outlined" aria-hidden="true">event</span>
                                        </div>
                                    </div>
                                    <p class="text-muted mt-3 mb-0">Tek tarih seçimi.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                </section>
            </div>
        </div>
    </main>
    <!--/::Main-->
    <script src="../../assets/js/core/bb-datepicker.js"></script>
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
<!--/::Scripts-->
</body>
<!--/::Body-->
</html>
