<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input Group</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,0,0,24&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">

    <!-- Bulbulustur Theme -->
    <link href="../../assets/css/main.css" rel="stylesheet" />
</head>
<!--/::Head-->

<!--::Body-->
<body class="bb-body">
    <div class="bb-wrapper">
        <header></header>
        
        <!--::Main-->
<main class="bb-main">

            <div class="bb-container">
                <section class="bb-section">
                    <div class="row g-4">
                        <!-- Basic -->
                        <div class="col-12 col-lg-6">
                            <div class="bb-card">
                                <div class="bb-card-header">
                                    <div class="bb-card-title">Basic</div>
                                </div>
                                <div class="bb-card-body">
                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text" id="basic-addon1">@</span>
                                        <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <input type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="basic-addon2">
                                        <span class="input-group-text" id="basic-addon2">@example.com</span>
                                    </div>

                                    <label for="basic-url" class="form-label">Your vanity URL</label>
                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
                                        <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3">
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text">$</span>
                                        <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
                                        <span class="input-group-text">.00</span>
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <input type="text" class="form-control" placeholder="Username" aria-label="Username">
                                        <span class="input-group-text">@</span>
                                        <input type="text" class="form-control" placeholder="Server" aria-label="Server">
                                    </div>

                                    <div class="input-group bb-input-group">
                                        <span class="input-group-text">With textarea</span>
                                        <textarea class="form-control" aria-label="With textarea"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Solid -->
                        <div class="col-12 col-lg-6">
                            <div class="bb-card">
                                <div class="bb-card-header">
                                    <div class="bb-card-title">Solid Style</div>
                                </div>
                                <div class="bb-card-body">
                                    <div class="input-group bb-input-group bb-input-group-solid mb-3">
                                        <span class="input-group-text" id="solid-addon1">@</span>
                                        <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="solid-addon1">
                                    </div>

                                    <div class="input-group bb-input-group bb-input-group-solid mb-3">
                                        <input type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="solid-addon2">
                                        <span class="input-group-text" id="solid-addon2">@example.com</span>
                                    </div>

                                    <label for="solid-url" class="form-label">Your vanity URL</label>
                                    <div class="input-group bb-input-group bb-input-group-solid mb-3">
                                        <span class="input-group-text" id="solid-addon3">https://example.com/users/</span>
                                        <input type="text" class="form-control" id="solid-url" aria-describedby="solid-addon3">
                                    </div>

                                    <div class="input-group bb-input-group bb-input-group-solid">
                                        <span class="input-group-text">With textarea</span>
                                        <textarea class="form-control" aria-label="With textarea"></textarea>
                                    </div>

                                    <div class="mt-3 text-muted small">
                                        Not: İstersen eski kullanım da geçerli → <code>.input-group-text.bb-input-group-solid</code>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Sizing -->
                        <div class="col-12">
                            <div class="bb-card">
                                <div class="bb-card-header">
                                    <div class="bb-card-title">Sizing</div>
                                </div>
                                <div class="bb-card-body">
                                    <div class="input-group bb-input-group input-group-sm mb-3">
                                        <span class="input-group-text" id="sizing-sm">Small</span>
                                        <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="sizing-sm">
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text" id="sizing-md">Default</span>
                                        <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="sizing-md">
                                    </div>

                                    <div class="input-group bb-input-group input-group-lg">
                                        <span class="input-group-text" id="sizing-lg">Large</span>
                                        <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="sizing-lg">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Icons (Material Symbols) -->
                        <div class="col-12">
                            <div class="bb-card">
                                <div class="bb-card-header">
                                    <div class="bb-card-title">Icons</div>
                                </div>
                                <div class="bb-card-body">
                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text" id="icon-addon1">
                                            <span class="material-symbols-outlined">person</span>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="icon-addon1">
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <input type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="icon-addon2">
                                        <span class="input-group-text" id="icon-addon2">
                                            <span class="material-symbols-outlined">sms</span>
                                        </span>
                                    </div>

                                    <div class="input-group bb-input-group mb-3">
                                        <span class="input-group-text" id="icon-addon3">
                                            <span class="material-symbols-outlined">language</span>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Website URL" aria-label="Website URL" aria-describedby="icon-addon3">
                                    </div>

                                    <div class="input-group bb-input-group">
                                        <span class="input-group-text">
                                            <span class="material-symbols-outlined">calendar_month</span>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Amount (to the nearest dollar)" aria-label="Amount">
                                        <span class="input-group-text">.00</span>
                                    </div>
                                </div>
                            </div>
                        
                    </div>

</div>
                

        </section></div></main>
<!--/::Main-->
        <!--::Footer-->
<footer></footer>
<!--/::Footer-->
        
    </div>
<script src="../../assets/js/panel/bb-component-panel-shell.js"></script></body>
<!--/::Body-->
</html>
