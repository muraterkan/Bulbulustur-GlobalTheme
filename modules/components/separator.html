<!DOCTYPE html>
<html lang="tr">
<head>

    <title>Bulbulustur Buttons</title>
      <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->

<body style="padding:2rem;">


  <div class="bb-separator my-15"></div>

  <div class="bb-separator bb-separator--content my-15">

</div>

  <span class="h1">Title</span>
</div>

<div class="bb-separator bb-separator--content border-dark my-15">
  <span class="fw-bold">Long separator title label</span>
</div>
<div class="bb-separator bb-separator--dashed bb-separator--content border-primary my-15">
  <i class="fs-1 text-primary material-symbols-outlined">
    auto_graph
  </i>
</div>
<div class="bb-separator bb-separator--dashed bb-separator--content border-primary my-15">
  <i class="fs-1 text-primary material-symbols-outlined">

  </i>
</div>

    check_box
  </i>
</div>
<div class="bb-separator bb-separator--content border-danger my-15">

    pie_chart
