<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Bulbulustur Theme — — Separator</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!--::Scripts-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <!--::Main-->
    <main class="bb-main">
        <!--::Wrapper-->
        <div class="bb-wrapper">
            <div class="bb-container">
                <section class="bb-section">
                    <div class="card bb-card">
                        <div class="bb-card-header">
                            <h2 class="bb-card-title">Basic</h2>
                        </div>
                        <div class="bb-card-body">
                            <div class="bb-separator mb-4"></div>
                            <div class="bb-separator has-content mb-4"><span>Separator</span></div>
                            <div class="bb-separator has-content is-dotted border-dark mb-4">
                                <span class="h5 mb-0">Title</span>
                            </div>
                            <div class="bb-separator has-content border-dark">
                                <span class="fw-bold">Long separator title label</span>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="bb-section">
                    <div class="card bb-card">
                        <div class="bb-card-header">
                            <h2 class="bb-card-title">Variants</h2>
                        </div>
                        <div class="bb-card-body">
                            <div class="bb-separator has-content is-dashed border-primary mb-4">
                                <span class="material-symbols-outlined text-primary" aria-hidden="true">auto_graph</span>
                            </div>
                            <div class="bb-separator has-content is-dotted border-success mb-4">
                                <span class="material-symbols-outlined text-success" aria-hidden="true">check_box</span>
                            </div>
                            <div class="bb-separator has-content border-danger">
                                <span class="material-symbols-outlined text-danger" aria-hidden="true">pie_chart</span>
                            </div>
                        </div>
                    </div>
                </section>
                <!--::Usage-->
                <section class="bb-section">
                    <div class="bb-card">
                        <div class="bb-card-header">
                            <div class="bb-card-title">How do I use it?</div>
                        </div>
                        <div class="bb-card-body">
                            <div class="bb-usage">
                                <h3 class="bb-usage-title">Separator</h3>
                                <p class="bb-usage-text"><code>bb-separator</code> yatay ayırıcı çizgidir; boşluk için yardımcı sınıflar (<code>my-4</code> vb.) kullanın.</p>
                                <div class="bb-usage-code">
                                    <div class="bb-usage-code-head">
                                        <span class="bb-usage-code-lang">HTML</span>
                                        <button type="button" class="bb-usage-copy">Copy</button>
                                    </div>
                                    <pre class="bb-usage-pre"><code>&lt;div class=&quot;bb-separator mb-4&quot;&gt;&lt;/div&gt;</code></pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!--/::Usage-->
            </div>
        </div>
    </main>
    <!--/::Main-->
    <script src="../../assets/js/core/bb-usage.js"></script>
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
    <!--/::Scripts-->
</body>
<!--/::Body-->
</html>
