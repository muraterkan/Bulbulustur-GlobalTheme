<!doctype html>
<html lang="tr" data-bs-theme="light">
<head>
  <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulbulustur Theme - Separator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<body>
  <div class="d-grid gap-4">
    <div>
      <section class="bb-card">
        <div class="bb-card-header"><h2 class="bb-card-title">Basic</h2></div>
        <div class="bb-card-body">
          <div class="bb-separator mb-4"></div>
          <div class="bb-separator has-content mb-4"><span>Separator</span></div>
          <div class="bb-separator has-content is-dotted border-dark mb-4"><span class="h5 mb-0">Title</span></div>
          <div class="bb-separator has-content border-dark"><span class="fw-bold">Long separator title label</span></div>
        </div>
      </section>
    </div>

    <div>
      <section class="bb-card">
        <div class="bb-card-header"><h2 class="bb-card-title">Variants</h2></div>
        <div class="bb-card-body">
          <div class="bb-separator has-content is-dashed border-primary mb-4">
            <span class="material-symbols-outlined text-primary" aria-hidden="true">auto_graph</span>
          </div>
          <div class="bb-separator has-content is-dotted border-success mb-4">
            <span class="material-symbols-outlined text-success" aria-hidden="true">check_box</span>
          </div>
          <div class="bb-separator has-content border-danger">
            <span class="material-symbols-outlined text-danger" aria-hidden="true">pie_chart</span>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
</html>
