<!DOCTYPE html>
<html lang="tr">
<head>
  <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbulustur Theme – Tiny Slider Advanced (3-up)</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
  <div class="bb-body">
    <main class="bb-main">
      <div class="bb-wrapper">
        <div class="bb-container">
  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="mb-0">Tiny Slider Advanced</h4>
        <div class="text-body-secondary small">3 item görünür, 3’lü kaydırır (loop + autoplay)</div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-light" type="button" data-bb-adv-prev>
          <span class="material-symbols-outlined align-middle">chevron_left</span>
        </button>
        <button class="btn btn-sm btn-light" type="button" data-bb-adv-next>
          <span class="material-symbols-outlined align-middle">chevron_right</span>
        </button>
      </div>
    </div>

    <!-- Advanced slider -->
    <div
      class="bb-tiny-slider"
      data-bb-slider-advanced
      data-bb-items="3"
      data-bb-step="3"
      data-bb-loop="true"
      data-bb-autoplay="true"
      data-bb-autoplay-timeout="6000">

      <div class="bb-ts-viewport">
        <div class="bb-ts-track" data-bb-track>
          <!-- Item -->
          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 1</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 2</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 3</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 4</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 5</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 6</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 7</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 8</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="p-3 text-center">
                <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                <div class="mt-2 small fw-semibold">Slide 9</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- (Nav kapalı) -->
    </div>
  </div>

    <script src="../../assets/js/core/bb-tiny-slider.js"></script>
  <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>

        </div>
      </div>
    </main>
  </div>
</body>
</html>
