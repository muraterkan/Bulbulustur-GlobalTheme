<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulbulustur Theme - Symbol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <div class="bb-wrapper">
        <header></header>

        <!--::Main-->
<main class="bb-main">

            <div class="bb-container">
                <section class="bb-section">

                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Basic Symbols</h2></div>
                        <div class="bb-card-body">
                            <div class="d-flex flex-wrap align-items-center gap-4">
                                <span class="bb-symbol size-50 is-circle">
                                    <img src="../../assets/media/avatars/300-6.webp" alt="Örnek kullanıcı" />
                                </span>

                                <span class="bb-symbol size-50">
                                    <span class="bb-symbol-label bg-primary text-white">A</span>
                                </span>

                                <span class="bb-symbol size-50 is-circle">
                                    <span class="bb-symbol-label bg-light">A</span>
                                    <span class="bb-symbol-badge badge rounded-circle bg-danger">3</span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Group</h2></div>
                        <div class="bb-card-body">
                            <div class="bb-symbol-group">
                                <span class="bb-symbol size-50 is-circle"><img src="../../assets/media/avatars/300-6.webp" alt="Kullanıcı 1" /></span>
                                <span class="bb-symbol size-50 is-circle">
                                    <span class="bb-symbol-label bg-success text-white">A</span>
                                </span>
                                <span class="bb-symbol size-50 is-circle"><img src="../../assets/media/avatars/300-2.webp" alt="Kullanıcı 2" /></span>
                            </div>
                        </div>
                    </div>

                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Sizes</h2></div>
                        <div class="bb-card-body">
                            <div class="d-flex flex-wrap align-items-end gap-4">
                                <span class="bb-symbol size-25 is-circle">
                                    <span class="bb-symbol-label">25</span>
                                </span>
                                <span class="bb-symbol size-35 is-circle">
                                    <span class="bb-symbol-label">35</span>
                                </span>
                                <span class="bb-symbol size-50 is-circle">
                                    <span class="bb-symbol-label">50</span>
                                </span>
                                <span class="bb-symbol size-75 is-circle">
                                    <span class="bb-symbol-label">75</span>
                                </span>
                                <span class="bb-symbol size-100 is-circle">
                                    <span class="bb-symbol-label">100</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
<!--/::Main-->
        <!--::Footer-->
<footer></footer>
<!--/::Footer-->
    </div>
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
<!--/::Body-->
</html>
