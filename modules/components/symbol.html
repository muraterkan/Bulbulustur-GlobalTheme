<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbulustur – Symbol Test</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body style="padding:2rem;">

  <!-- SYMBOL TEST AREA -->
  <div class="d-flex flex-column gap-5">

    <!-- Image -->
    <div class="bb-symbol bb-symbol-50px bb-symbol-circle">
      <img src="/assets/media/avatars/300-6.jpg" alt="">
    </div>

    <!-- Background image -->
    <div class="bb-symbol bb-symbol-50px">
      <div class="bb-symbol-label"
           style="background-image:url('/assets/media/avatars/300-12.jpg')">
      </div>
    </div>

    <!-- Letter -->
    <div class="bb-symbol bb-symbol-50px">
      <div class="bb-symbol-label fs-4 fw-semibold bg-primary text-white">
        A
      </div>
    </div>

    <!-- Badge -->
    <div class="bb-symbol bb-symbol-50px bb-symbol-circle">
      <div class="bb-symbol-label bg-light">A</div>
      <span class="bb-symbol-badge badge rounded-circle bg-danger">3</span>
    </div>

    <!-- Group -->
    <div class="bb-symbol-group">
      <div class="bb-symbol bb-symbol-50px bb-symbol-circle">
        <img src="/assets/media/avatars/300-6.jpg">
      </div>

      <div class="bb-symbol bb-symbol-50px bb-symbol-circle">
        <div class="bb-symbol-label bg-success text-white">A</div>
      </div>

      <div class="bb-symbol bb-symbol-50px bb-symbol-circle">
        <img src="/assets/media/avatars/300-2.jpg">
      </div>
    </div>

  </div>

  <script src="../../assets/js/bb-component-panel-shell.js"></script>
</body>
</html>
