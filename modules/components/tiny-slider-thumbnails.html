<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulbulustur Theme — Tiny Slider (Thumbnails)</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
   <!--::Scripts--> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">

    <!--::Main-->
    <main class="bb-main">
        <!--::Wrapper-->
<div class="bb-wrapper">
            <div class="bb-container">
                <section class="bb-section">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div>
                            <h4 class="mb-0">Tiny Slider – Thumbnails</h4>
                            <div class="text-body-secondary small">3 item görünür + thumbnail nav</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-light" type="button" data-bb-thumb-prev>
                                <span class="material-symbols-outlined align-middle">chevron_left</span>
                            </button>
                            <button class="btn btn-sm btn-light" type="button" data-bb-thumb-next>
                                <span class="material-symbols-outlined align-middle">chevron_right</span>
                            </button>
                        </div>
                    </div>
                </section>
                <section class="bb-section">
                    <!-- MAIN SLIDER -->
                    <div class="bb-tiny-slider mb-3 bb-ts-thumb-shell"
                         data-bb-slider-thumbs
                         data-bb-items="3"
                         data-bb-step="1"
                         data-bb-center="true"
                         data-bb-loop="true"
                         data-bb-autoplay="true"
                         data-bb-autoplay-timeout="7000">

                        <div class="bb-ts-viewport">
                            <div class="bb-ts-track" data-bb-track>
                                <!-- 1 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 1</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 2 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 2</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 3 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 3</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 4 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 4</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 5 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 5</div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 6 -->
                                <div class="bb-ts-slide">
                                    <div class="bb-ts-slide-inner">
                                        <div class="p-3 text-center">
                                            <div class="ratio ratio-16x9 bg-body-secondary rounded"></div>
                                            <div class="mt-2 small fw-semibold">Team 6</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="bb-section">
                    <!-- THUMBNAILS -->
                    <div class="d-flex justify-content-center">
                        <div class="bb-ts-thumbs" data-bb-thumbs>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 1">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 2">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 3">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 4">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 5">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                            <button type="button" class="bb-ts-thumb" aria-label="Thumb 6">
                                <span class="bb-ts-thumb-img bg-body-secondary"></span>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <!--/::Main-->

    <script src="../../assets/js/core/bb-tiny-slider.js"></script>
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
<!--/::Body-->
</html>
