<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="utf-8">
    <title>Bulbulustur • Bullet</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<!--::Body-->
<body class="bb-body">
    <div class="bb-wrapper">
        <header></header>
        
        <main class="bb-main">

            <div class="bb-container">
                <section class="bb-section">
                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Basic</h2></div>
                        <div class="bb-card-body">
                            <ul class="list-unstyled mb-0">
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet me-3"></span> Item 1
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet me-3"></span> Item 2
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet me-3"></span> Item 3
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Colors & Variants</h2></div>
                        <div class="bb-card-body">
                            <ul class="list-unstyled mb-0">
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bg-primary me-3"></span> Primary
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bg-success me-3"></span> Success
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bg-danger me-3"></span> Danger
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bb-bullet-dot bg-info me-3"></span> Dot
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bb-bullet-vertical bg-warning me-3"></span> Vertical
                                </li>
                                <li class="d-flex align-items-center py-2">
                                    <span class="bb-bullet bb-bullet-line bg-dark me-3"></span> Line
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="bb-card">
                        <div class="bb-card-header"><h2 class="bb-card-title">Sizes</h2></div>
                        <div class="bb-card-body">
                            <div class="d-flex align-items-center gap-4">
                                <span class="bb-bullet bb-bullet-sm bg-primary" aria-label="Small"></span>
                                <span class="bb-bullet bg-success" aria-label="Default"></span>
                                <span class="bb-bullet bb-bullet-lg bg-danger" aria-label="Large"></span>
                            </div>
                        </div>
                    </div>



                </section>
            </div></main>
        <footer></footer>
        
    </div>
<script src="../../assets/js/panel/bb-component-panel-shell.js"></script></body>
<!--/::Body-->
</html>
