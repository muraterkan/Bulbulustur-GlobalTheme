<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Bulbulustur • Bullet</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="p-5">

  <h4 class="mb-4">Basic</h4>
  <ul class="list-unstyled">
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet me-3"></span> Item 1
    </li>
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet me-3"></span> Item 2
    </li>
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet me-3"></span> Item 3
    </li>
  </ul>

  <h4 class="mt-5 mb-4">Colors</h4>
  <ul class="list-unstyled">
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bg-primary me-3"></span> primary
    </li>
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bg-success me-3"></span> success
    </li>
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bg-danger me-3"></span> danger
    </li>
  </ul>

  <h4 class="mt-5 mb-4">Dot</h4>
  <ul class="list-unstyled">
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bb-bullet-dot bg-info me-3"></span> Dot item
    </li>
  </ul>

  <h4 class="mt-5 mb-4">Vertical</h4>
  <ul class="list-unstyled">
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bb-bullet-vertical bg-warning me-3"></span> Vertical item
    </li>
  </ul>

  <h4 class="mt-5 mb-4">Line</h4>
  <ul class="list-unstyled">
    <li class="d-flex align-items-center py-2">
      <span class="bb-bullet bb-bullet-line bg-dark me-3"></span> Line item
    </li>
  </ul>

  <h4 class="mt-5 mb-4">Custom Sizes (Utility)</h4>
  <div class="d-flex align-items-center gap-4">
    <span class="bb-bullet bg-primary w-25px h-15px"></span>
    <span class="bb-bullet bb-bullet-dot bg-success w-20px h-20px"></span>
    <span class="bb-bullet bb-bullet-vertical bg-danger w-15px h-25px"></span>
  </div>

  <script src="../../assets/js/bb-component-panel-shell.js"></script>
</body>
</html>
