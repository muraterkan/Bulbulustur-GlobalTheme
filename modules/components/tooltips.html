<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title>Bulbulustur Theme — Bulbulustur Theme — Tooltips</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
   <!--::Scripts--> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <!--::Main-->
    <main class="bb-main">

        <!--::Wrapper-->
<div class="bb-wrapper">
            <div class="bb-container">
                <section class="bb-section">
 
                    <div class="bb-card p-4">
                        <h2 class="h5 mb-3">Basic</h2>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-primary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip"
                                    data-bs-placement="top"
                                    title="Tooltip on top">
                                Tooltip on top
                            </button>

                            <button type="button" class="btn btn-primary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip"
                                    data-bs-placement="right"
                                    title="Tooltip on right">
                                Tooltip on right
                            </button>

                            <button type="button" class="btn btn-primary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip"
                                    data-bs-placement="bottom"
                                    title="Tooltip on bottom">
                                Tooltip on bottom
                            </button>

                            <button type="button" class="btn btn-primary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip"
                                    data-bs-placement="left"
                                    title="Tooltip on left">
                                Tooltip on left
                            </button>
                        </div>

                        <hr class="my-4" />

                        <h2 class="h5 mb-3">Inverse</h2>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-secondary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip bb-tooltip-inverse"
                                    data-bs-placement="top"
                                    title="Inverse tooltip (top)">
                                Inverse top
                            </button>

                            <button type="button" class="btn btn-secondary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip bb-tooltip-inverse"
                                    data-bs-placement="right"
                                    title="Inverse tooltip (right)">
                                Inverse right
                            </button>

                            <button type="button" class="btn btn-secondary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip bb-tooltip-inverse"
                                    data-bs-placement="bottom"
                                    title="Inverse tooltip (bottom)">
                                Inverse bottom
                            </button>

                            <button type="button" class="btn btn-secondary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip bb-tooltip-inverse"
                                    data-bs-placement="left"
                                    title="Inverse tooltip (left)">
                                Inverse left
                            </button>
                        </div>

                        <hr class="my-4" />

                        <h2 class="h5 mb-3">Dismiss Options</h2>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <button type="button" class="btn btn-outline-secondary"
                                    data-bs-toggle="tooltip"
                                    data-bs-custom-class="bb-tooltip"
                                    data-bs-dismiss="click"
                                    title="Click = hide">
                                Dismissable tooltip
                            </button>

                            <span class="text-muted small">
                                Not: Hover/focus ile görünür, tıklayınca kapanır.
                            </span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <!--/::Main-->
    <script src="../../assets/js/core/bb-tooltip.js"></script>
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
<!--/::Body-->
</html>
