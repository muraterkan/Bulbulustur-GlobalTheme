<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!--::Head-->
<head>
    <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title>Bulbulustur Theme — Bulbulustur Theme — Progress</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
   <!--::Scripts--> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<!--/::Head-->
<!--::Body-->
<body class="bb-body">
    <!--::Main-->
    <main class="bb-main">

        <!--::Wrapper-->
<div class="bb-wrapper">
            <div class="bb-container">
                <section class="bb-section">

                    <div class="col-12 col-lg-6">
                        <div class="bb-card h-100">
                            <div class="bb-card-header">
                                <div>
                                    <h2 class="bb-card-title">Basic</h2>
                                    <div class="text-muted small">Small ve medium örnekleri</div>
                                </div>
                            </div>
                            <div class="bb-card-body">
                                <div class="bb-progress bb-progress--sm w-100">
                                    <div class="bb-progress__meta">
                                        <span class="bb-progress__label">Prifilee Completion</span>
                                        <span class="bb-progress__value">50%</span>
                                    </div>
                                    <div class="bb-progress__track" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                                        <div class="bb-progress__bar" style="width: 50%;"></div>
                                    </div>
                                </div>

                                <div class="bb-progress bb-progress--md mt-4">
                                    <div class="bb-progress__meta">
                                        <span class="bb-progress__label">Order Progress</span>
                                        <span class="bb-progress__value">72%</span>
                                    </div>
                                    <div class="bb-progress__track" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100">
                                        <div class="bb-progress__bar" style="width: 72%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <div class="bb-card h-100">
                            <div class="bb-card-header">
                                <div>
                                    <h2 class="bb-card-title">States</h2>
                                    <div class="text-muted small">Loading ve disabled durumları</div>
                                </div>
                            </div>
                            <div class="bb-card-body">
                                <div class="bb-progress bb-progress--sm is-loading w-100">
                                    <div class="bb-progress__meta">
                                        <span class="bb-progress__label">Syncing</span>
                                        <span class="bb-progress__value">30%</span>
                                    </div>
                                    <div class="bb-progress__track" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">
                                        <div class="bb-progress__bar" style="width: 30%;"></div>
                                    </div>
                                </div>

                                <div class="bb-progress bb-progress--sm is-disabled w-100 mt-4">
                                    <div class="bb-progress__meta">
                                        <span class="bb-progress__label">Disabled Example</span>
                                        <span class="bb-progress__value">100%</span>
                                    </div>
                                    <div class="bb-progress__track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                                        <div class="bb-progress__bar" style="width: 100%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </section>
            </div>
        </div>
    </main>
    <!--/::Main-->
    <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
<!--/::Body-->
</html>
