<!DOCTYPE html>
<html lang="tr">
<head>
  <script src="../../assets/js/panel/bb-panel-theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbulustur Theme – Tiny Slider Test</title>
    <!-- Main Theme CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css" />

    <!-- Bootstrap 5 (main.css zaten bootstrap içeriyorsa bunu kaldırabilirsin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body class="bg-body-tertiary">
  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h4 class="mb-0">Tiny Slider</h4>
        <div class="text-body-secondary small">Vendor yok, hafif scroll-snap + minimal JS</div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-light" type="button" id="btnItems1">1 item</button>
        <button class="btn btn-sm btn-light" type="button" id="btnItems2">2 items</button>
        <button class="btn btn-sm btn-light" type="button" id="btnItems3">3 items</button>
      </div>
    </div>

    <!-- Slider -->
    <div class="bb-tiny-slider" data-bb-items="1" data-bb-slider>
      <div class="bb-ts-viewport">
        <div class="bb-ts-track" data-bb-track>
          <!-- Slide -->
          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 1</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 2</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 3</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 4</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 5</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>

          <div class="bb-ts-slide">
            <div class="bb-ts-slide-inner">
              <div class="ratio ratio-16x9 bg-body-secondary"></div>
              <div class="bb-ts-caption">
                <div class="fw-semibold">Slide 6</div>
                <div class="text-body-secondary small">Caption örneği</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="bb-ts-controls">
        <button class="bb-ts-btn" type="button" data-bb-prev aria-label="Önceki">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <button class="bb-ts-btn" type="button" data-bb-next aria-label="Sonraki">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <!-- Dots -->
      <div class="bb-ts-nav" data-bb-nav></div>
    </div>
  </div>

    <script src="../../assets/js/core/bb-tiny-slider.js"></script>
  <script src="../../assets/js/panel/bb-component-panel-shell.js"></script>
</body>
</html>
