<!DOCTYPE html>
<html lang="tr" data-bb-pack="workshop" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renk Paketi: WORKSHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("theme") === "dark") document.documentElement.setAttribute("data-bs-theme", "dark");
      if (q.get("pack") === "off") document.documentElement.removeAttribute("data-bb-pack");
    })();
  </script>
  <style>
    .sw { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
    .sw div { width: 92px; border: 1px solid var(--bb-border-color); border-radius: .5rem; overflow: hidden; background: var(--bb-surface-bg); font-size: 11px; }
    .sw i { display: block; height: 44px; }
    .sw span { display: block; padding: .25rem .4rem; color: var(--bb-body-color); line-height: 1.25; }
    h2 { font-size: 1rem; margin: 1.5rem 0 .6rem; }
  </style>
</head>
<body style="background: var(--bb-body-bg); color: var(--bb-body-color);">
  <header>
</header>
<main class="container py-4" style="max-width: 1040px;">
    <h1 style="font-size: 1.5rem;">Renk Paketi: WORKSHOP <small style="color: var(--bb-secondary-color); font-size: .9rem;">html[data-bb-pack="workshop"]</small></h1>
    <p style="color: var(--bb-secondary-color);">Açık/koyu: <a href="?">açık</a> · <a href="?theme=dark">koyu</a> · <a href="?pack=off">paket kapalı (varsayılan sarı)</a></p>

    <h2>Palet</h2>
    <div class="sw" id="sw"></div>

    <h2>Semantik</h2>
    <div class="sw" id="sem"></div>

    <h2>Bileşenler</h2>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-dark">Dark</button>
      <button class="btn btn-light">Light</button>
      <a href="#" style="color: var(--bb-link-color);">Bağlantı</a>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="p-3" style="background: var(--bb-surface-bg); border: 1px solid var(--bb-border-color); border-radius: .75rem; box-shadow: var(--bb-shadow-sm);">
          <div style="font-weight: 600;">Kart yüzeyi</div>
          <div style="color: var(--bb-secondary-color);">İkincil metin</div>
          <div style="color: var(--bb-tertiary-color);">Üçüncül metin</div>
          <span style="display:inline-block; margin-top:.5rem; padding:.15rem .5rem; border-radius:99px; background: var(--bb-primary-light); color: var(--bb-primary);">primary-light</span>
          <span style="display:inline-block; margin-top:.5rem; padding:.15rem .5rem; border-radius:99px; background: var(--bb-page-accent-soft); color: var(--bb-page-accent-strong);">accent-soft</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3" style="background: var(--bb-header-top-bg); color: var(--bb-header-top-color); border-radius: .75rem;">Header üst şerit</div>
        <div class="p-3 mt-2" style="background: var(--bb-footer-bg); color: var(--bb-footer-color); border-radius: .75rem;">Footer zemini · <span style="color: var(--bb-footer-heading-color)">başlık</span></div>
      </div>
    </main>
<footer>
</footer>
  <script>
    var cs = getComputedStyle(document.documentElement);
    function mk(host, names) {
      var el = document.getElementById(host);
      names.forEach(function (n) {
        var v = cs.getPropertyValue(n).trim();
        el.insertAdjacentHTML("beforeend", '<div><i style="background:var(' + n + ')"></i><span>' + n.replace("--bb-", "") + "<br>" + v + "</span></div>");
      });
    }
    var scale = ["50","100","200","300","400","500","600","700","800","900"];
    var pal = [];
    ["terracotta","sage","olive"].forEach(function (f) { scale.forEach(function (s) { pal.push("--bb-" + f + "-" + s); }); });
    ["50","100","200","300","400"].forEach(function (s) { pal.push("--bb-sand-" + s); });
    mk("sw", pal);
    mk("sem", ["--bb-body-bg","--bb-surface-bg","--bb-secondary-bg","--bb-body-color","--bb-secondary-color","--bb-border-color","--bb-primary","--bb-primary-hover","--bb-primary-active","--bb-primary-inverse","--bb-secondary","--bb-success","--bb-info","--bb-warning","--bb-danger","--bb-dark","--bb-light","--bb-link-color","--bb-page-accent"]);
  </script>
</body>
<!--/::Body-->
</html>
